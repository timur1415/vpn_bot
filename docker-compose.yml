services:
  vpn_bot:
    build: .
    container_name: vpn_bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/vpn_bot.db
    ports:
      - "8000:8000"
    volumes:
      - ./vpn_bot.db:/app/vpn_bot.db
      - ./photo:/app/photo
      - ./templates:/app/templates