<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>GLOW VPN · Админ</title>
    <script src="https://telegram.org/js/telegram-web-app.js?62"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Michroma&display=swap" rel="stylesheet" />
    <style>
        :root {
            --bg: #07040f;
            --bg-glow-1: rgba(139, 77, 255, 0.34);
            --bg-glow-2: rgba(196, 120, 255, 0.16);
            --surface: rgba(34, 19, 68, 0.42);
            --surface-2: rgba(44, 26, 86, 0.62);
            --border: rgba(178, 140, 255, 0.16);
            --text: #f3eeff;
            --muted: rgba(221, 206, 255, 0.6);
            --faint: rgba(190, 160, 255, 0.12);
            --accent: #9d6bff;
            --accent-2: #d59bff;
            --grad: linear-gradient(135deg, #7c3aed 0%, #a66bff 55%, #d59bff 100%);
            --neon: 0 0 22px rgba(157, 107, 255, 0.55);
            --ok: #57e6a8;
            --warn: #ffc35c;
            --danger: #ff6b8e;
            --info: #8fb2ff;
            --shadow: 0 22px 44px -24px rgba(0, 0, 0, 0.85), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            --radius: 22px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { min-height: 100%; }
        body {
            font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
            color: var(--text);
            background:
                radial-gradient(640px 400px at 0% -10%, var(--bg-glow-1), transparent 70%),
                radial-gradient(520px 360px at 110% 10%, var(--bg-glow-2), transparent 70%),
                var(--bg);
            background-attachment: fixed;
            min-height: 100dvh;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
        }

        button { font: inherit; color: inherit; }

        .page {
            max-width: 1100px;
            margin: 0 auto;
            padding: 16px 16px calc(28px + env(safe-area-inset-bottom));
            display: grid;
            gap: 14px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }

        /* Header */
        .top {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 4px 2px 0;
        }
        .top-text { flex: 1; min-width: 0; }
        .top h1 { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
        .top p { font-size: 13px; color: var(--muted); margin-top: 5px; }
        .icon-btn {
            width: 42px; height: 42px; border-radius: 12px;
            display: grid; place-items: center;
            border: 1px solid var(--border);
            background: var(--surface);
            cursor: pointer;
            transition: transform 0.15s;
        }
        .icon-btn:active { transform: scale(0.94); }
        .icon-btn.spin svg { animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Stats */
        .stats {
            display: grid;
            grid-template-columns: repeat(6, minmax(0, 1fr));
            gap: 10px;
        }
        .stat {
            appearance: none;
            text-align: left;
            padding: 14px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: transform 0.15s, border-color 0.2s;
            animation: rise 0.45s cubic-bezier(.2,.8,.2,1) both;
        }
        .stat:active { transform: scale(0.97); }
        .stat.static { cursor: default; }
        .stat.static:active { transform: none; }
        .stat.selected { border-color: color-mix(in srgb, var(--c) 55%, transparent); }
        .stat::after {
            content: "";
            position: absolute;
            right: -30px; top: -30px;
            width: 90px; height: 90px; border-radius: 50%;
            background: radial-gradient(circle, color-mix(in srgb, var(--c) 28%, transparent), transparent 70%);
        }
        .stat-label { font-size: 12px; color: var(--muted); font-weight: 500; }
        .stat-value {
            font-size: 28px; font-weight: 800; letter-spacing: -0.03em;
            margin-top: 8px; line-height: 1;
            color: var(--c);
        }
        .stat:nth-child(1) { --c: var(--accent-2); animation-delay: 0s; }
        .stat:nth-child(2) { --c: var(--accent); animation-delay: 0.03s; }
        .stat:nth-child(3) { --c: var(--ok); animation-delay: 0.06s; }
        .stat:nth-child(4) { --c: var(--warn); animation-delay: 0.09s; }
        .stat:nth-child(5) { --c: var(--danger); animation-delay: 0.12s; }
        .stat:nth-child(6) { --c: var(--info); animation-delay: 0.15s; }

        @keyframes rise {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: none; }
        }

        /* Toolbar */
        .toolbar {
            display: grid;
            gap: 10px;
            position: sticky;
            top: 0;
            z-index: 5;
            padding: 10px 0;
            margin: -4px 0;
            background: linear-gradient(rgba(7, 4, 15, 0.92) 70%, transparent);
        }
        .search-row { display: flex; gap: 10px; }
        .search {
            flex: 1;
            display: flex; align-items: center; gap: 10px;
            padding: 0 14px;
            height: 46px;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: var(--surface-2);
            color: var(--muted);
        }
        .search:focus-within { border-color: color-mix(in srgb, var(--accent) 70%, transparent); box-shadow: 0 0 0 4px rgba(157, 107, 255, 0.15); }
        .search input {
            flex: 1; min-width: 0;
            border: 0; outline: 0; background: transparent;
            font: inherit; font-size: 15px; color: var(--text);
        }
        .search input::placeholder { color: var(--muted); }

        .danger-btn {
            display: inline-flex; align-items: center; gap: 8px;
            height: 46px; padding: 0 14px;
            border-radius: 14px;
            border: 1px solid color-mix(in srgb, var(--danger) 35%, transparent);
            background: color-mix(in srgb, var(--danger) 12%, transparent);
            color: var(--danger);
            font-weight: 700; font-size: 13px;
            cursor: pointer; white-space: nowrap;
            transition: transform 0.15s, opacity 0.2s;
        }
        .danger-btn:active { transform: scale(0.97); }
        .danger-btn:disabled { opacity: 0.45; cursor: not-allowed; }

        .chips {
            display: flex; gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
            padding-bottom: 2px;
        }
        .chips::-webkit-scrollbar { display: none; }
        .chip {
            appearance: none;
            display: inline-flex; align-items: center; gap: 6px;
            padding: 8px 14px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: var(--surface);
            font-size: 13px; font-weight: 600;
            color: var(--muted);
            cursor: pointer; white-space: nowrap;
            transition: background 0.2s, color 0.2s, border-color 0.2s;
        }
        .chip b {
            font-size: 11px; font-weight: 700;
            padding: 2px 7px; border-radius: 999px;
            background: var(--faint);
        }
        .chip.active {
            color: #fff;
            background: var(--grad);
            border-color: transparent;
            box-shadow: 0 6px 18px -6px rgba(157, 107, 255, 0.9);
        }
        .chip.active b { background: rgba(255, 255, 255, 0.22); }

        /* Users */
        .list-head {
            display: flex; justify-content: space-between; align-items: baseline;
            padding: 0 4px;
            font-size: 13px; color: var(--muted);
        }
        .users {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 10px;
        }
        .user {
            padding: 14px;
            display: grid;
            gap: 12px;
            animation: rise 0.35s cubic-bezier(.2,.8,.2,1) both;
        }
        .user-top {
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 12px;
            align-items: center;
        }
        .u-avatar {
            width: 42px; height: 42px; border-radius: 50%;
            display: grid; place-items: center;
            font-weight: 800; font-size: 16px; color: #fff;
            background: linear-gradient(135deg, hsl(var(--h) 85% 72%), hsl(calc(var(--h) + 25) 75% 48%));
            box-shadow: 0 0 16px -2px hsl(var(--h) 90% 60% / 0.55);
        }
        .u-name { font-weight: 700; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .u-name.none { color: var(--muted); font-weight: 600; }
        .u-id {
            font-size: 12px; color: var(--muted); margin-top: 2px;
            font-variant-numeric: tabular-nums;
            cursor: pointer;
        }
        .u-id:active { color: var(--accent); }

        .pill {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 5px 10px;
            border-radius: 999px;
            font-size: 11px; font-weight: 700;
            background: color-mix(in srgb, var(--pill) 15%, transparent);
            color: var(--pill);
            white-space: nowrap;
        }
        .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
        .pill.ok { --pill: var(--ok); }
        .pill.warn { --pill: var(--warn); }
        .pill.danger { --pill: var(--danger); }

        .u-tariff {
            display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
        }
        .tag {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 6px 10px;
            border-radius: 10px;
            background: var(--faint);
            font-size: 12px; font-weight: 600;
        }
        .tag svg { width: 14px; height: 14px; color: var(--muted); }
        .tag.free { background: color-mix(in srgb, var(--info) 15%, transparent); color: var(--info); }
        .tag.free svg { color: currentColor; }

        .progress { display: grid; gap: 6px; }
        .progress-row {
            display: flex; justify-content: space-between;
            font-size: 12px; color: var(--muted);
        }
        .progress-row b { color: var(--pc); font-weight: 700; }
        .bar {
            height: 6px; border-radius: 999px;
            background: var(--faint);
            overflow: hidden;
        }
        .bar span {
            display: block; height: 100%;
            border-radius: inherit;
            background: var(--pc);
            box-shadow: 0 0 10px var(--pc);
            transition: width 0.8s cubic-bezier(.2,.8,.2,1);
        }
        .progress.ok { --pc: #a66bff; }
        .progress.warn { --pc: var(--warn); }
        .progress.danger { --pc: var(--danger); }
        .progress.none { --pc: var(--muted); }

        .user-bottom {
            display: flex; justify-content: space-between; align-items: center; gap: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--border);
        }
        .dates { display: flex; gap: 14px; font-size: 11px; color: var(--muted); }
        .dates b { display: block; color: var(--text); font-size: 12px; font-weight: 600; margin-top: 2px; }

        .del-btn {
            appearance: none;
            width: 38px; height: 38px; border-radius: 11px;
            display: grid; place-items: center;
            border: 1px solid color-mix(in srgb, var(--danger) 25%, transparent);
            background: color-mix(in srgb, var(--danger) 9%, transparent);
            color: var(--danger);
            cursor: pointer; flex-shrink: 0;
            transition: transform 0.15s, background 0.2s;
        }
        .del-btn:active { transform: scale(0.92); }
        .del-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px 16px;
            color: var(--muted);
            font-size: 14px;
        }
        .empty svg { width: 40px; height: 40px; opacity: 0.5; margin-bottom: 10px; }

        .sk {
            display: block; height: 14px; border-radius: 8px;
            background: linear-gradient(90deg, var(--faint) 0%, color-mix(in srgb, var(--faint) 40%, transparent) 50%, var(--faint) 100%);
            background-size: 200% 100%;
            animation: shimmer 1.2s infinite linear;
        }
        @keyframes shimmer { to { background-position: -200% 0; } }

        .toast {
            position: fixed;
            left: 50%; bottom: calc(20px + env(safe-area-inset-bottom));
            transform: translate(-50%, 20px);
            opacity: 0;
            padding: 12px 16px;
            border-radius: 14px;
            background: var(--text);
            color: var(--bg);
            font-size: 14px; font-weight: 600;
            box-shadow: 0 14px 30px -10px rgba(0, 0, 0, 0.5);
            transition: opacity 0.25s, transform 0.25s;
            pointer-events: none;
            max-width: calc(100% - 32px);
            z-index: 20;
        }
        .toast.show { opacity: 1; transform: translate(-50%, 0); }

        @media (max-width: 900px) {
            .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        }
        @media (max-width: 520px) {
            .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .users { grid-template-columns: 1fr; }
            .danger-btn span { display: none; }
            .danger-btn { width: 46px; padding: 0; justify-content: center; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
        }

        /* GLOW brand */
        .brand {
            font-family: Michroma, Inter, sans-serif;
            font-size: 17px;
            letter-spacing: 0.16em;
            line-height: 1.1;
            background: linear-gradient(180deg, #ffffff 10%, #c8afff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 10px rgba(157, 107, 255, 0.65));
            white-space: nowrap;
        }
        .brand .o { position: relative; display: inline-block; }
        .brand .o::after {
            content: "\2726";
            position: absolute;
            left: 50%; top: 50%;
            transform: translate(-50%, -54%);
            font-size: 0.42em;
            letter-spacing: 0;
            -webkit-text-fill-color: #fff;
            color: #fff;
        }
        .brand small {
            font-size: 0.56em;
            letter-spacing: 0.42em;
            margin-left: 6px;
            -webkit-text-fill-color: var(--accent-2);
            color: var(--accent-2);
            vertical-align: middle;
        }
        .logo-img {
            width: 48px; height: 48px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            border: 1px solid rgba(190, 150, 255, 0.45);
            box-shadow: 0 0 0 4px rgba(157, 107, 255, 0.12), 0 0 26px rgba(157, 107, 255, 0.6);
            animation: breathe 4s ease-in-out infinite;
        }
        @keyframes breathe {
            0%, 100% { box-shadow: 0 0 0 4px rgba(157, 107, 255, 0.12), 0 0 22px rgba(157, 107, 255, 0.5); }
            50% { box-shadow: 0 0 0 6px rgba(157, 107, 255, 0.18), 0 0 34px rgba(170, 120, 255, 0.8); }
        }
        .fireflies { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
        .fireflies i {
            position: absolute;
            width: 4px; height: 4px; border-radius: 50%;
            background: #e2ccff;
            box-shadow: 0 0 6px 2px rgba(180, 130, 255, 0.9), 0 0 16px 4px rgba(140, 80, 255, 0.5);
            opacity: 0;
            animation: drift var(--d, 14s) linear infinite, blink var(--b, 3s) ease-in-out infinite;
            animation-delay: var(--delay, 0s), var(--delay, 0s);
        }
        @keyframes drift {
            from { transform: translate(0, 0); }
            to { transform: translate(var(--dx, 30px), -110vh); }
        }
        @keyframes blink {
            0%, 100% { opacity: 0; }
            40%, 60% { opacity: var(--o, 0.8); }
        }
        .page { position: relative; z-index: 1; }
    </style>
</head>

                const f = document.createElement('i');

            document.body.prepend(box);
        })();

            return s ? `?${s}` : "";

        };

        const icons = {
            trash: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
            tag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.5"/></svg>',
            phone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18h2"/></svg>',
            gift: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 12v9h14v-9M12 8v13M12 8S10.5 3 8 3.5 7 8 12 8zm0 0s1.5-5 4-4.5S17 8 12 8z"/></svg>',
            users: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-3.9 3.1-7 7-7s7 3.1 7 7M16 4a4 4 0 0 1 0 8M22 21c0-3-1.8-5.6-4.5-6.6"/></svg>',
        };

        function escapeHtml(value) {
            return String(value ?? "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#39;");
        }

        function plural(n, one, few, many) {
            const a = Math.abs(n) % 100;
            const b = a % 10;
            if (a > 10 && a < 20) return many;
            if (b === 1) return one;
            if (b >= 2 && b <= 4) return few;
            return many;
        }

        // Сервер хранит время в UTC без зоны: "YYYY-MM-DD HH:MM:SS[.ffffff]"
        function parseDate(value) {
            if (!value) return null;
            const d = new Date(String(value).replace(" ", "T").slice(0, 19) + "Z");
            return Number.isNaN(d.getTime()) ? null : d;
        }

        function fmtDate(value) {
            const d = parseDate(value);
            if (!d) return "—";
            return d.toLocaleDateString("ru-RU", { day: "2-digit", month: "2-digit", year: "2-digit" });
        }

        const isFree = (u) => String(u.tariff || "").toLowerCase().includes("бесплат");
        const isExpired = (u) => u.status === "EXPIRED" || (typeof u.days_left === "number" && u.days_left < 0);
        const isSoon = (u) => !isExpired(u) && typeof u.days_left === "number" && u.days_left >= 0 && u.days_left <= 3;
        const isActive = (u) => u.status === "ACTIVE" && !isExpired(u);

        const FILTERS = {
            all: () => true,
            active: isActive,
            soon: isSoon,
            expired: isExpired,
            free: isFree,
        };

        function haptic(type) {
            try {
                if (!tg || !tg.HapticFeedback) return;
                if (type === "select") tg.HapticFeedback.selectionChanged();
                else if (type === "success" || type === "error" || type === "warning") tg.HapticFeedback.notificationOccurred(type);
                else tg.HapticFeedback.impactOccurred(type || "light");
            } catch (e) {}
        }

        let toastTimer = null;
        function toast(text) {
            const el = $("toast");
            el.textContent = text;
            el.classList.add("show");
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
        }

        function confirmDialog(text) {
            return new Promise((resolve) => {
                if (tg && tg.showConfirm && tg.isVersionAtLeast && tg.isVersionAtLeast("6.2")) {
                    try { tg.showConfirm(text, (ok) => resolve(Boolean(ok))); return; } catch (e) {}
                }
                resolve(window.confirm(text));
            });
        }

        function hue(id) {
            let h = 0;
            const s = String(id);
            for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360;
            return 245 + (h % 70);
        }

        function renderStats() {
            const counts = {
                all: allRows.length,
                active: allRows.filter(isActive).length,
                soon: allRows.filter(isSoon).length,
                expired: allRows.filter(isExpired).length,
                free: allRows.filter(isFree).length,
            };
            $("statTotal").textContent = counts.all;
            $("statActive").textContent = counts.active;
            $("statSoon").textContent = counts.soon;
            $("statExpired").textContent = counts.expired;
            $("statFree").textContent = counts.free;
            $("chipAll").textContent = counts.all;
            $("chipActive").textContent = counts.active;
            $("chipSoon").textContent = counts.soon;
            $("chipExpired").textContent = counts.expired;
            $("chipFree").textContent = counts.free;
            deleteAllExpiredBtn.disabled = counts.expired === 0;
        }

        function userCard(u, index) {
            const expired = isExpired(u);
            const soon = isSoon(u);
            const state = expired ? "danger" : soon ? "warn" : "ok";
            const statusText = expired ? "Истекла" : soon ? "Скоро" : "Активна";
            const days = typeof u.days_left === "number" ? u.days_left : null;

            const start = parseDate(u.started_at);
            const end = parseDate(u.expires_at);
            let pct = 0;
            if (!expired && start && end && end > start) {
                pct = Math.max(3, Math.min(100, ((end - Date.now()) / (end - start)) * 100));
            }

            let daysText = "—";
            if (days !== null) {
                daysText = days < 0
                    ? `истекла ${Math.abs(days)} ${plural(Math.abs(days), "день", "дня", "дней")} назад`
                    : days === 0 ? "последний день" : `${days} ${plural(days, "день", "дня", "дней")}`;
            }

            const name = u.username
                ? `<div class="u-name">@${escapeHtml(u.username)}</div>`
                : `<div class="u-name none">Без username</div>`;
            const initial = u.username ? escapeHtml(u.username.charAt(0).toUpperCase()) : "#";
            const devices = Number(u.device_count || 1);
            const free = isFree(u);
            const tid = escapeHtml(u.telegram_id);

            return `
                <article class="card user" style="animation-delay:${Math.min(index, 12) * 0.03}s">
                    <div class="user-top">
                        <div class="u-avatar" style="--h:${hue(u.telegram_id)}">${initial}</div>
                        <div style="min-width:0">
                            ${name}
                            <div class="u-id" data-copy="${tid}" title="Скопировать ID">ID ${tid}</div>
                        </div>
                        <span class="pill ${state}">${statusText}</span>
                    </div>
                    <div class="u-tariff">
                        <span class="tag ${free ? "free" : ""}">${free ? icons.gift : icons.tag}${escapeHtml(u.tariff || "—")}</span>
                        <span class="tag">${icons.phone}${devices} ${plural(devices, "устройство", "устройства", "устройств")}</span>
                    </div>
                    <div class="progress ${days === null ? "none" : state}">
                        <div class="progress-row"><span>Осталось</span><b>${daysText}</b></div>
                        <div class="bar"><span style="width:${pct}%"></span></div>
                    </div>
                    <div class="user-bottom">
                        <div class="dates">
                            <div>Старт<b>${fmtDate(u.started_at)}</b></div>
                            <div>Конец<b>${fmtDate(u.expires_at)}</b></div>
                            <div>Добавлен<b>${fmtDate(u.created_at)}</b></div>
                        </div>
                        <button class="del-btn" type="button" data-delete="${tid}" aria-label="Удалить пользователя">${icons.trash}</button>
                    </div>
                </article>`;
        }

        function renderList() {
            const q = query.trim().toLowerCase().replace(/^@/, "");
            const rows = allRows.filter(FILTERS[filter]).filter((u) => {
                if (!q) return true;
                return [u.username, u.telegram_id, u.tariff].some((v) => String(v ?? "").toLowerCase().includes(q));
            });

            $("listTitle").textContent = FILTER_TITLES[filter];
            $("listCount").textContent = `${rows.length} ${plural(rows.length, "пользователь", "пользователя", "пользователей")}`;

            if (!rows.length) {
                usersEl.innerHTML = `<div class="empty">${icons.users}<div>${allRows.length ? "Никого не найдено" : "Пользователей пока нет"}</div></div>`;
                return;
            }
            usersEl.innerHTML = rows.map(userCard).join("");
        }

        function setFilter(next) {
            if (!FILTERS[next]) return;
            filter = next;
            document.querySelectorAll("[data-filter]").forEach((el) => {
                const on = el.dataset.filter === next;
                el.classList.toggle(el.classList.contains("chip") ? "active" : "selected", on);
            });
            const chip = document.querySelector(`.chip[data-filter="${next}"]`);
            if (chip) chip.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });
            if (loaded) renderList();
        }

        function showError(text) {
            usersEl.innerHTML = `<div class="empty">${icons.users}<div>${escapeHtml(text)}</div></div>`;
            $("listCount").textContent = "";
        }

        async function loadUsers() {
            if (!tgId) {
                showError("Не удалось определить Telegram ID");
                $("updatedAt").textContent = "Нет доступа";
                return;
            }
            refreshBtn.classList.add("spin");
            try {
                const response = await fetch(`/admin/api/users${apiQuery()}`, { headers: { Accept: "application/json" } });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                allRows = data.users || [];
                loaded = true;
                $("statVisitors").textContent = Number(data.visitors_count || 0);
                renderStats();
                renderList();
                const now = new Date().toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
                $("updatedAt").textContent = `Панель управления · ${now}`;
            } catch (e) {
                showError("Не удалось загрузить данные");
                $("updatedAt").textContent = "Ошибка загрузки";
            } finally {
                refreshBtn.classList.remove("spin");
            }
        }

        async function deleteUser(button) {
            const id = button.dataset.delete;
            const user = allRows.find((u) => String(u.telegram_id) === id);
            const who = user && user.username ? `@${user.username}` : `ID ${id}`;
            const active = user && !isExpired(user);
            const text = active
                ? `⚠️ У ${who} АКТИВНАЯ подписка (${user.tariff || "тариф"}). Удалить пользователя из БД полностью?`
                : `Удалить ${who} из БД полностью?`;

            haptic("warning");
            if (!(await confirmDialog(text))) return;

            button.disabled = true;
            try {
                const response = await fetch(`/admin/api/users/${encodeURIComponent(id)}${apiQuery({ force: "true" })}`, { method: "DELETE" });
                if (!response.ok) {
                    let detail = "Не удалось удалить пользователя";
                    try {
                        const payload = await response.json();
                        if (payload && payload.detail) detail = payload.detail;
                    } catch (e) {}
                    throw new Error(detail);
                }
                haptic("success");
                const card = button.closest(".user");
                if (card) {
                    card.style.transition = "opacity 0.25s, transform 0.25s";
                    card.style.opacity = "0";
                    card.style.transform = "scale(0.96)";
                }
                toast(`${who} удалён`);
                setTimeout(loadUsers, 250);
            } catch (e) {
                haptic("error");
                toast(e.message || "Ошибка при удалении");
                button.disabled = false;
            }
        }

        usersEl.addEventListener("click", (event) => {
            const del = event.target.closest("[data-delete]");
            if (del) { deleteUser(del); return; }
            const copy = event.target.closest("[data-copy]");
            if (copy && navigator.clipboard) {
                navigator.clipboard.writeText(copy.dataset.copy)
                    .then(() => { haptic("select"); toast("ID скопирован"); })
                    .catch(() => {});
            }
        });

        document.querySelectorAll("[data-filter]").forEach((el) => {
            el.addEventListener("click", () => { haptic("select"); setFilter(el.dataset.filter); });
        });

        let searchTimer = null;
        searchEl.addEventListener("input", () => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => { query = searchEl.value; renderList(); }, 120);
        });

        refreshBtn.addEventListener("click", () => { haptic("light"); loadUsers(); });

        deleteAllExpiredBtn.addEventListener("click", async () => {
            const count = allRows.filter(isExpired).length;
            if (count === 0) { toast("Истекших пользователей нет"); return; }
            haptic("warning");
            const ok = await confirmDialog(`Удалить всех истекших пользователей (${count})?`);
            if (!ok) return;

            deleteAllExpiredBtn.disabled = true;
            try {
                const response = await fetch(`/admin/api/users/delete-expired${apiQuery()}`, { method: "DELETE" });
                if (!response.ok) throw new Error("Не удалось удалить истекшие подписки");
                const payload = await response.json();
                const deleted = Number(payload.deleted_count || 0);
                haptic("success");
                toast(`Удалено: ${deleted} ${plural(deleted, "пользователь", "пользователя", "пользователей")}`);
                await loadUsers();
            } catch (e) {
                haptic("error");
                toast(e.message || "Ошибка при удалении");
                renderStats();
            }
        });

        setFilter("all");
        loadUsers();
    </script>
</body>
</html>
