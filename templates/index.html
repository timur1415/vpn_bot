<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>GLOW VPN · Кабинет</title>
    <script src="https://telegram.org/js/telegram-web-app.js?62"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Michroma&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #07040f;
            --bg-glow-1: rgba(139, 77, 255, 0.34);
            --bg-glow-2: rgba(196, 120, 255, 0.16);
            --surface: rgba(34, 19, 68, 0.42);
            --surface-2: rgba(44, 26, 86, 0.62);
            --border: rgba(178, 140, 255, 0.16);
            --text: #f3eeff;
            --muted: rgba(221, 206, 255, 0.6);
            --faint: rgba(190, 160, 255, 0.12);
            --accent: #9d6bff;
            --accent-2: #d59bff;
            --grad: linear-gradient(135deg, #7c3aed 0%, #a66bff 55%, #d59bff 100%);
            --neon: 0 0 22px rgba(157, 107, 255, 0.55);
            --ok: #57e6a8;
            --warn: #ffc35c;
            --danger: #ff6b8e;
            --info: #8fb2ff;
            --shadow: 0 22px 44px -24px rgba(0, 0, 0, 0.85), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            --radius: 22px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { min-height: 100%; }
        body {
            font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
            color: var(--text);
            background:
                radial-gradient(600px 380px at 0% -10%, var(--bg-glow-1), transparent 70%),
                radial-gradient(520px 360px at 110% 20%, var(--bg-glow-2), transparent 70%),
                var(--bg);
            background-attachment: fixed;
            min-height: 100dvh;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
        }

        .page {
            max-width: 560px;
            margin: 0 auto;
            padding: 16px 16px calc(24px + env(safe-area-inset-bottom));
            display: grid;
            gap: 14px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            animation: rise 0.45s cubic-bezier(.2,.8,.2,1) both;
        }
        .card:nth-child(2) { animation-delay: 0.05s; }
        .card:nth-child(3) { animation-delay: 0.10s; }
        .card:nth-child(4) { animation-delay: 0.15s; }
        .card:nth-child(5) { animation-delay: 0.20s; }

        @keyframes rise {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: none; }
        }

        /* Header */
        .top {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 4px 2px 2px;
        }
        .avatar {
            width: 46px; height: 46px;
            border-radius: 50%;
            display: grid; place-items: center;
            font-weight: 800; font-size: 18px;
            color: #fff;
            background: var(--grad);
            box-shadow: var(--neon);
            flex-shrink: 0;
            overflow: hidden;
            margin-left: auto;
            width: 38px; height: 38px; font-size: 15px;
        }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .hello { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
        .hello-sub { font-size: 13px; color: var(--muted); margin-top: 5px; }

        /* Hero */
        .hero {
            padding: 22px 20px 20px;
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 20px;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

M6CjzjjHQGP4UCwBS4AA") center / cover no-repeat;
            opacity: 0.32;
            mix-blend-mode: screen;
            -webkit-mask-image: radial-gradient(120% 100% at 25% 50%, #000 30%, transparent 85%);
            mask-image: radial-gradient(120% 100% at 25% 50%, #000 30%, transparent 85%);
            pointer-events: none;
        }
        .hero::after {
            content: "";
            position: absolute;
            width: 240px; height: 240px;
            left: -60px; top: 50%;
            transform: translateY(-50%);
            border-radius: 50%;
            background: radial-gradient(circle, var(--state-glow, rgba(157,107,255,0.35)), transparent 70%);
            pointer-events: none;
        }
        .ring, .hero-info { z-index: 1; }

        .ring {
            --state: var(--accent);
            position: relative;
            width: 128px; height: 128px;
        }
        .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
        .ring .track { stroke: var(--faint); }
        .ring .bar {
            stroke: var(--state);
            transition: stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1), stroke 0.3s;
            filter: drop-shadow(0 0 7px var(--ring-glow, #9d6bff));
        }
        .ring-center {
            position: absolute; inset: 0;
            display: grid; place-content: center;
            text-align: center;
        }
        .ring-num {
            font-size: 38px; font-weight: 800;
            letter-spacing: -0.04em; line-height: 1;
        }
        .ring-unit { font-size: 12px; color: var(--muted); margin-top: 4px; }

        .hero-info { display: grid; gap: 10px; position: relative; z-index: 1; min-width: 0; }
        .hero-tariff {
            font-size: 20px; font-weight: 700; line-height: 1.2;
            letter-spacing: -0.01em;
            overflow-wrap: anywhere;
        }
        .hero-until { font-size: 13px; color: var(--muted); }

        .pill {
            display: inline-flex; align-items: center; gap: 6px;
            width: fit-content;
            padding: 6px 11px;
            border-radius: 999px;
            font-size: 12px; font-weight: 700;
            background: color-mix(in srgb, var(--pill, var(--muted)) 16%, transparent);
            color: var(--pill, var(--muted));
        }
        .pill::before {
            content: "";
            width: 7px; height: 7px; border-radius: 50%;
            background: currentColor;
            box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 25%, transparent);
        }
        .pill.ok { --pill: var(--ok); }
        .pill.warn { --pill: var(--warn); }
        .pill.danger { --pill: var(--danger); }
        .pill.ok::before { animation: pulse 2s infinite; }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 25%, transparent); }
            50% { box-shadow: 0 0 0 6px color-mix(in srgb, currentColor 0%, transparent); }
        }

        /* Alert */
        .alert {
            padding: 16px;
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 12px 14px;
            align-items: center;
            border-color: color-mix(in srgb, var(--alert-c) 35%, transparent);
            background: color-mix(in srgb, var(--alert-c) 12%, var(--surface));
        }
        .alert[hidden] { display: none; }
        .alert.warn { --alert-c: var(--warn); }
        .alert.danger { --alert-c: var(--danger); }
        .alert-icon {
            width: 40px; height: 40px; border-radius: 12px;
            display: grid; place-items: center;
            background: color-mix(in srgb, var(--alert-c) 22%, transparent);
            color: var(--alert-c);
        }
        .alert-title { font-weight: 700; font-size: 15px; }
        .alert-text { font-size: 13px; color: var(--muted); margin-top: 2px; line-height: 1.4; }
        .btn {
            grid-column: 1 / -1;
            appearance: none; border: 0;
            border-radius: 14px;
            padding: 13px 16px;
            font: inherit; font-weight: 700; font-size: 14px;
            color: #fff;
            background: var(--grad);
            box-shadow: 0 10px 26px -8px rgba(157, 107, 255, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.25);
            letter-spacing: 0.01em;
            cursor: pointer;
            transition: transform 0.15s, filter 0.15s;
        }
        .btn:active { transform: scale(0.98); filter: brightness(0.95); }

        /* Tiles */
        .tiles {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .tile {
            padding: 14px 16px;
            display: grid; gap: 10px;
        }
        .tile-head {
            display: flex; align-items: center; gap: 8px;
            color: var(--muted); font-size: 12px; font-weight: 500;
        }
        .tile-head svg { width: 16px; height: 16px; color: var(--accent-2); flex-shrink: 0; filter: drop-shadow(0 0 4px rgba(157,107,255,0.8)); }
        .tile-value { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
        .tile-value small { display: block; font-size: 12px; color: var(--muted); font-weight: 500; margin-top: 2px; }

        /* Payments */
        .section { padding: 18px 16px 10px; }
        .section-head {
            display: flex; justify-content: space-between; align-items: baseline;
            padding: 0 4px 10px;
        }
        .section-head h2 { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
        .section-head span { font-size: 12px; color: var(--muted); }

        .pay {
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 12px;
            align-items: center;
            padding: 12px 4px;
            border-top: 1px solid var(--border);
        }
        .pay:first-child { border-top: 0; }
        .pay-icon {
            width: 40px; height: 40px; border-radius: 12px;
            display: grid; place-items: center;
            background: color-mix(in srgb, var(--pay-c) 15%, transparent);
            color: var(--pay-c);
        }
        .pay-icon svg { width: 20px; height: 20px; }
        .pay.ok { --pay-c: var(--ok); }
        .pay.warn { --pay-c: var(--warn); }
        .pay.danger { --pay-c: var(--danger); }
        .pay-title { font-size: 14px; font-weight: 600; overflow-wrap: anywhere; }
        .pay-date { font-size: 12px; color: var(--muted); margin-top: 3px; }
        .pay-right { text-align: right; }
        .pay-amount { font-size: 15px; font-weight: 700; white-space: nowrap; }
        .pay-status { font-size: 11px; font-weight: 700; color: var(--pay-c); margin-top: 3px; }

        .empty {
            text-align: center;
            padding: 26px 12px 22px;
            color: var(--muted);
            font-size: 14px;
        }
        .empty svg { width: 38px; height: 38px; opacity: 0.5; margin-bottom: 8px; }

        /* Skeleton */
        .sk {
            display: inline-block;
            height: 1em; width: 70%;
            border-radius: 8px;
            vertical-align: middle;
            background: linear-gradient(90deg, var(--faint) 0%, color-mix(in srgb, var(--faint) 40%, transparent) 50%, var(--faint) 100%);
            background-size: 200% 100%;
            animation: shimmer 1.2s infinite linear;
        }
        @keyframes shimmer { to { background-position: -200% 0; } }

        .footer {
            text-align: center;
            font-size: 12px;
            color: var(--muted);
            padding: 6px 0 0;
        }

        @media (max-width: 360px) {
            .hero { grid-template-columns: 1fr; justify-items: center; text-align: center; }
            .hero-info { justify-items: center; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
        }

        /* GLOW brand */
        .brand {
            font-family: Michroma, Inter, sans-serif;
            font-size: 17px;
            letter-spacing: 0.16em;
            line-height: 1.1;
            background: linear-gradient(180deg, #ffffff 10%, #c8afff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 10px rgba(157, 107, 255, 0.65));
            white-space: nowrap;
        }
        .brand .o { position: relative; display: inline-block; }
        .brand .o::after {
            content: "\2726";
            position: absolute;
            left: 50%; top: 50%;
            transform: translate(-50%, -54%);
            font-size: 0.42em;
            letter-spacing: 0;
            -webkit-text-fill-color: #fff;
            color: #fff;
        }
        .brand small {
            font-size: 0.56em;
            letter-spacing: 0.42em;
            margin-left: 6px;
            -webkit-text-fill-color: var(--accent-2);
            color: var(--accent-2);
            vertical-align: middle;
        }
        .logo-img {
            width: 48px; height: 48px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            border: 1px solid rgba(190, 150, 255, 0.45);
            box-shadow: 0 0 0 4px rgba(157, 107, 255, 0.12), 0 0 26px rgba(157, 107, 255, 0.6);
            animation: breathe 4s ease-in-out infinite;
        }
        @keyframes breathe {
            0%, 100% { box-shadow: 0 0 0 4px rgba(157, 107, 255, 0.12), 0 0 22px rgba(157, 107, 255, 0.5); }
            50% { box-shadow: 0 0 0 6px rgba(157, 107, 255, 0.18), 0 0 34px rgba(170, 120, 255, 0.8); }
        }
        .fireflies { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
        .fireflies i {
            position: absolute;
            width: 4px; height: 4px; border-radius: 50%;
            background: #e2ccff;
            box-shadow: 0 0 6px 2px rgba(180, 130, 255, 0.9), 0 0 16px 4px rgba(140, 80, 255, 0.5);
            opacity: 0;
            animation: drift var(--d, 14s) linear infinite, blink var(--b, 3s) ease-in-out infinite;
            animation-delay: var(--delay, 0s), var(--delay, 0s);
        }
        @keyframes drift {
            from { transform: translate(0, 0); }
            to { transform: translate(var(--dx, 30px), -110vh); }
        }
        @keyframes blink {
            0%, 100% { opacity: 0; }
            40%, 60% { opacity: var(--o, 0.8); }
        }
        .page { position: relative; z-index: 1; }
    </style>
</head>
<body>

        const tgUser = tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user : null;
        const tgId = params.get('tg_id') || (tgUser && tgUser.id ? String(tgUser.id) : '');
        const apiUrl = tgId ? `/cabinet/api/profile?tg_id=${encodeURIComponent(tgId)}` : null;

        const $ = (id) => document.getElementById(id);
        const CIRC = 2 * Math.PI * 52;

        const icons = {
            check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
            clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
            cross: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7l10 10M17 7L7 17"/></svg>',
            receipt: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>',
        };

        function escapeHtml(value) {
            return String(value ?? '')
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#39;');
        }

        function plural(n, one, few, many) {
            const a = Math.abs(n) % 100;
            const b = a % 10;
            if (a > 10 && a < 20) return many;
            if (b === 1) return one;
            if (b >= 2 && b <= 4) return few;
            return many;
        }

        // Сервер хранит время в UTC без зоны: "YYYY-MM-DD HH:MM:SS[.ffffff]"
        function parseDate(value) {
            if (!value) return null;
            const d = new Date(String(value).replace(' ', 'T').slice(0, 19) + 'Z');
            return Number.isNaN(d.getTime()) ? null : d;
        }

        function fmtDate(value, withTime) {
            const d = parseDate(value);
            if (!d) return '—';
            const opts = { day: 'numeric', month: 'long', year: 'numeric' };
            if (withTime) Object.assign(opts, { hour: '2-digit', minute: '2-digit' });
            return d.toLocaleString('ru-RU', opts).replace(' г.', '');
        }

        function fmtMoney(value) {
            const n = Number(value);
            if (Number.isFinite(n)) return `${n.toLocaleString('ru-RU')} ₽`;
            return `${escapeHtml(value)} ₽`;
        }

        function setRing(fraction, state) {
            const f = Math.max(0, Math.min(1, fraction));
            const ring = $('ring');
            const strokes = { ok: 'url(#ringGrad)', warn: 'var(--warn)', danger: 'var(--danger)', none: 'var(--muted)' };
            const glows = { ok: '#9d6bff', warn: '#ffc35c', danger: '#ff6b8e', none: 'transparent' };
            ring.style.setProperty('--state', strokes[state] || 'url(#ringGrad)');
            ring.style.setProperty('--ring-glow', glows[state] || '#9d6bff');
            $('hero').style.setProperty('--state-glow', state === 'none' ? 'transparent' : `color-mix(in srgb, ${glows[state]} 32%, transparent)`);
            requestAnimationFrame(() => {
                $('ringBar').style.strokeDashoffset = String(CIRC * (1 - f));
            });
        }

        function setPill(text, state) {
            const pill = $('statusPill');
            pill.textContent = text;
            pill.className = `pill ${state === 'none' ? '' : state}`;
        }

        function showAlert(state, title, text) {
            const alert = $('alert');
            alert.className = `card alert ${state}`;
            $('alertTitle').textContent = title;
            $('alertText').textContent = text;
            alert.hidden = false;
        }

        function renderGreeting() {
            if (!tgUser) return;
            if (tgUser.first_name) $('hello').textContent = `Привет, ${tgUser.first_name}!`;
            const avatar = $('avatar');
            if (tgUser.photo_url) {
                const img = document.createElement('img');
                img.src = tgUser.photo_url;
                img.alt = '';
                img.onerror = () => img.remove();
                avatar.replaceChildren(img);
            } else if (tgUser.first_name) {
                avatar.textContent = tgUser.first_name.trim().charAt(0).toUpperCase();
            }
        }

        function renderNoSubscription(message) {
            $('daysNum').textContent = '0';
            $('daysUnit').textContent = 'дней';
            setRing(0, 'none');
            setPill('Нет подписки', 'none');
            $('tariff').textContent = 'Подписка не оформлена';
            $('until').textContent = message || 'Выберите тариф в боте, чтобы подключиться';
            $('devices').textContent = '—';
            $('statusText').textContent = 'Не активна';
            $('startedAt').textContent = '—';
            $('expiresAt').textContent = '—';
            showAlert('warn', 'Подключите VPN', 'Вернитесь в бот и выберите подходящий тариф — есть бесплатный пробный период.');
            $('renewBtn').textContent = 'Выбрать тариф в боте';
        }

        function renderUser(user) {
            const days = typeof user.days_left === 'number' ? user.days_left : null;
            const expired = user.status === 'EXPIRED' || (days !== null && days < 0);
            const soon = !expired && days !== null && days <= 3;
            const state = expired ? 'danger' : (soon ? 'warn' : 'ok');

            const shownDays = days === null ? 0 : Math.max(0, days);
            $('daysNum').textContent = String(shownDays);
            $('daysUnit').textContent = expired ? 'истекла' : plural(shownDays, 'день', 'дня', 'дней');

            const start = parseDate(user.started_at);
            const end = parseDate(user.expires_at);
            let fraction = 0;
            if (!expired && start && end && end > start) {
                fraction = (end - Date.now()) / (end - start);
            } else if (!expired && days !== null) {
                fraction = Math.min(1, days / 30);
            }
            setRing(expired ? 0 : Math.max(fraction, 0.03), state);

            setPill(expired ? 'Истекла' : (soon ? 'Скоро закончится' : 'Активна'), state);
            $('tariff').textContent = user.tariff || 'Тариф';
            $('until').textContent = end
                ? `${expired ? 'Закончилась' : 'Действует до'} ${fmtDate(user.expires_at)}`
                : '';

            const devices = Number(user.device_count || 1);
            $('devices').innerHTML = `${devices}<small>${plural(devices, 'устройство', 'устройства', 'устройств')}</small>`;
            $('statusText').innerHTML = `${expired ? 'Не активна' : 'Активна'}<small>${expired ? 'доступ закрыт' : 'VPN работает'}</small>`;
            $('startedAt').textContent = fmtDate(user.started_at);
            $('expiresAt').textContent = fmtDate(user.expires_at);

            if (expired) {
                showAlert('danger', 'Подписка закончилась', 'Продлите её в боте, чтобы снова пользоваться VPN.');
            } else if (soon) {
                const left = days === 0 ? 'сегодня' : `через ${days} ${plural(days, 'день', 'дня', 'дней')}`;
                showAlert('warn', `Подписка закончится ${left}`, 'Продлите заранее, чтобы VPN не отключился.');
            }
        }

        function renderPayments(payments) {
            const list = $('paymentsList');
            if (!payments.length) {
                $('paymentsCount').textContent = '';
                list.innerHTML = `<div class="empty">${icons.receipt}<div>Платежей пока нет</div></div>`;
                return;
            }
            $('paymentsCount').textContent = `${payments.length} ${plural(payments.length, 'платёж', 'платежа', 'платежей')}`;
            list.innerHTML = payments.map((p) => {
                const status = String(p.status || '').toUpperCase();
                let cls = 'warn', label = 'Ожидает оплаты', icon = icons.clock;
                if (status === 'CONFIRMED') { cls = 'ok'; label = 'Оплачен'; icon = icons.check; }
                else if (status === 'EXPIRED') { cls = 'danger'; label = 'Истёк'; icon = icons.cross; }
                return `
                    <div class="pay ${cls}">
                        <div class="pay-icon">${icon}</div>
                        <div>
                            <div class="pay-title">${escapeHtml(p.tariff || 'Оплата')}</div>
                            <div class="pay-date">${fmtDate(p.paid_at || p.created_at, true)}</div>
                        </div>
                        <div class="pay-right">
                            <div class="pay-amount">${fmtMoney(p.amount)}</div>
                            <div class="pay-status">${label}</div>
                        </div>
                    </div>`;
            }).join('');
        }

        function renderError(text) {
            setRing(0, 'none');
            $('daysNum').textContent = '–';
            setPill('Ошибка', 'danger');
            $('tariff').textContent = 'Не удалось загрузить';
            $('until').textContent = text;
            ['devices', 'statusText', 'startedAt', 'expiresAt'].forEach((id) => { $(id).textContent = '—'; });
            $('paymentsCount').textContent = '';
            $('paymentsList').innerHTML = `<div class="empty">${icons.receipt}<div>Данные недоступны</div></div>`;
        }

        $('renewBtn').addEventListener('click', () => {
            if (tg) {
                try { tg.HapticFeedback && tg.HapticFeedback.impactOccurred('medium'); } catch (e) {}
                tg.close();
            }
        });

        async function loadProfile() {
            renderGreeting();
            if (!apiUrl) {
                renderError('Откройте кабинет кнопкой в боте');
                return;
            }
            const response = await fetch(apiUrl, { headers: { 'Accept': 'application/json' } });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();

            if (!data.user) {
                renderNoSubscription();
            } else {
                renderUser(data.user);
            }
            renderPayments(data.payments || []);
        }

        loadProfile().catch(() => {
            renderError('Попробуйте открыть кабинет ещё раз из бота');
            if (tg && tg.showAlert) {
                try { tg.showAlert('Не удалось загрузить личный кабинет'); } catch (e) {}
            }
        });
    </script>
</body>
</html>
